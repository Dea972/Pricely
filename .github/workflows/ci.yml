name: CI

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Pricely.slnx 2>&1 | tee restore.log; exit ${PIPESTATUS[0]}

      - name: Build
        run: dotnet build Pricely.slnx --no-restore -c Release 2>&1 | tee build.log; exit ${PIPESTATUS[0]}

      - name: Unit and architecture tests
        run: |
          set -o pipefail
          status=0
          for p in $(find . -name '*.UnitTests.csproj' -o -name '*.ArchitectureTests.csproj'); do
            dotnet test "$p" --no-build -c Release 2>&1 | tee -a test.log || status=1
          done
          exit $status

      - name: Report errors as annotation
        if: failure()
        run: |
          cat restore.log build.log test.log 2>/dev/null \
            | grep -E "error |Failed |\[FAIL\]|Assert|Expected" \
            | sed -E 's#/home/runner/work/[^/]+/[^/]+/##g; s/ \[[^]]*\.csproj[^]]*\]$//' \
            | grep -vE "Failed to restore" | sort -u | head -150 > errors.txt || true
          echo "::error title=Build errors::$(sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g' errors.txt)"
          cat build.log 2>/dev/null | grep -oE "error [A-Z]+[0-9]+" | sort | uniq -c | sort -rn > codes.txt || true
          cat build.log 2>/dev/null | grep -E "error [A-Z]+[0-9]+" | sed -E 's#/home/runner/work/[^/]+/[^/]+/##g' | awk -F'[(:]' '{print $1}' | sort | uniq -c | sort -rn | head -60 > files.txt || true
          echo "::error title=Error codes::$(cat codes.txt files.txt | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')"

      - name: Report vulnerable packages
        if: failure()
        run: |
          dotnet restore Pricely.slnx -p:TreatWarningsAsErrors=false > /dev/null 2>&1 || true
          dotnet list Pricely.slnx package --vulnerable --include-transitive 2>&1 \
            | grep -E "Project|^\s+>" | sed -E 's/\s+/ /g' | sort -u > vulnerable.txt || true
          for id in $(grep -ohE "GHSA-[a-z0-9]{4}-[a-z0-9]{4}-[a-z0-9]{4}" restore.log | sort -u); do
            curl -s -H "Authorization: Bearer ${{ github.token }}" "https://api.github.com/advisories/$id" \
              | jq -r --arg id "$id" '.vulnerabilities[] | "\($id) \(.package.name) \(.vulnerable_version_range) -> patched \(.first_patched_version // "none")"' >> patched.txt || true
          done
          echo "::error title=Vulnerable packages::$(cat patched.txt vulnerable.txt | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')"

      - name: Report test summary
        if: always()
        run: |
          summary=$(grep -E "^(Passed|Failed)!|Total tests|Passed:|Failed:" test.log 2>/dev/null | sed -E 's#/home/runner/work/[^/]+/[^/]+/##g' | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')
          echo "::notice title=Test summary::${summary:-no test output}"
